name: Delete shared question

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/delete-question.yml'
      - 'scripts/**'
      - 'tests/source-deletion.cjs'

permissions:
  contents: read

concurrency:
  group: delete-shared-question
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/source-deletion.cjs
  delete:
    if: github.event_name == 'issues' && contains(github.event.issue.body, '<!-- studyroom-delete:v1 -->')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/delete-question-action.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
